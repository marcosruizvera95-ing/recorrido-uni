  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universidad Nacional de Itapúa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --brick-dark: #5c2620;
      --brick: #7a3327;
      --terracotta: #a85a3d;
      --terracotta-light: #c78a5f;
      --clay: #8f4530;
      --cream: #fbf4ec;
      --ink: #2a1a14;
      --gold: #e0b25a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #20120e;
      color: var(--ink);
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .script {
      font-family: 'Dancing Script', 'Segoe Script', cursive;
    }

    .page {
      width: 100%;
      max-width: 1600px;
      background: #000;
      box-shadow: 0 0 60px rgba(0, 0, 0, .6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---------- HEADER ---------- */
    header {
      background: linear-gradient(105deg, var(--brick-dark) 0%, var(--brick) 30%, var(--terracotta) 65%, var(--terracotta-light) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px clamp(14px, 2.6vw, 34px);
      gap: 14px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .crest {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #f1e6d8 55%, #dcc7a8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .35), 0 2px 6px rgba(0, 0, 0, .35);
    }

    .crest svg {
      width: 28px;
      height: 28px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: clamp(13px, 1.55vw, 20px);
      font-weight: 800;
      letter-spacing: .3px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: clamp(10.5px, 1.05vw, 13.5px);
      font-weight: 500;
      opacity: .92;
      white-space: nowrap;
    }

    nav.mainnav {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.6vw, 26px);
      flex: 0 0 auto;
      padding: 0 clamp(8px, 1.6vw, 22px);
      position: relative;
    }

    nav.mainnav::before,
    nav.mainnav::after {
      content: "";
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, .55);
    }

    .navlink {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(10.5px, 1.05vw, 13.5px);
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: .2px;
    }

    .navlink svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .navlink+.navlink {
      padding-left: clamp(10px, 1.6vw, 26px);
      border-left: 1px solid rgba(255, 255, 255, .4);
    }

    .tagline {
      flex: 0 0 auto;
      text-align: left;
      font-size: clamp(11.5px, 1.15vw, 17px);
      line-height: 1.05;
      max-width: 290px;
      display: none;
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1600/810;
      background-size: cover;
      background-position: center;
    }

    .panel {
      position: absolute;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .indice-panel {
      top: 5%;
      left: 1.2%;
      width: 19%;
      min-width: 150px;
      height: 80%;
      padding: 3% 4% 3% 1%;
      display: flex;
      flex-direction: column;
    }

    .indice-panel h2 {
      margin: 0 0 .6em;
      padding-left: .6em;
      font-size: clamp(14px, 1.7vw, 22px);
      font-weight: 800;
      letter-spacing: .3px;
      color: var(--ink);
      flex: 0 0 auto;
    }

    .indice-body {
      display: flex;
      align-items: stretch;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .indice-list-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .indice-panel ol {
      list-style: none;
      margin: 0;
      padding: 0;
      counter-reset: idx;
      display: flex;
      flex-direction: column;
      gap: .55em;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .indice-panel ol::-webkit-scrollbar {
      display: none;
    }

    .indice-panel li {
      counter-increment: idx;
      font-size: clamp(11px, 1.35vw, 17px);
      font-weight: 500;
      color: #3a2a22;
      display: flex;
      gap: .4em;
      flex: 0 0 auto;
    }

    .indice-panel li::before {
      content: counter(idx)".";
      font-weight: 600;
      color: #3a2a22;
    }

    .indice-slider {
      position: relative;
      flex: 0 0 20px;
      width: 20px;
      cursor: pointer;
      touch-action: none;
      order: -1;
    }

    .indice-slider .track {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background: #1a1a1a;
      border-radius: 2px;
      opacity: .85;
    }

    .indice-thumb {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, 0);
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    .indice-thumb:active {
      cursor: grabbing;
    }

    .indice-thumb svg {
      width: 18px;
      height: 18px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
    }

    .indice-thumb:focus-visible {
      outline: 2px solid var(--terracotta);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .fac-panel {
      top: 12%;
      right: 1%;
      width: 38%;
      min-width: 280px;
      padding: 2.2% 2.6% 1.6%;
    }

    .fac-panel h2 {
      margin: 0 0 .5em;
      font-size: clamp(14px, 1.7vw, 20px);
      font-weight: 800;
      color: var(--ink);
    }

    .fac-divider {
      height: 2px;
      background: linear-gradient(90deg, var(--brick) 0%, var(--terracotta-light) 60%, transparent 100%);
      margin-bottom: .9em;
      border-radius: 2px;
    }

    .fac-row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .fac-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4em;
      flex: 1 1 0;
      min-width: 0;
    }

    .fac-icon {
      width: clamp(30px, 4.4vw, 52px);
      height: clamp(30px, 4.4vw, 52px);
      border-radius: 50%;
      background: #f4ede3;
      border: 2px solid #d8c3a5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .fac-icon svg {
      width: 60%;
      height: 60%;
    }

    .fac-item span {
      font-size: clamp(8px, .85vw, 11.5px);
      font-weight: 600;
      text-align: center;
      color: #3a2a22;
      line-height: 1.15;
    }

    .fac-more {
      position: absolute;
      top: 50%;
      right: -4%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
    }

    .fac-more svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5));
    }

    /* ---------- FOOTER ---------- */
    footer {
      background: linear-gradient(105deg, var(--terracotta-light) 0%, var(--terracotta) 35%, var(--brick) 70%, var(--brick-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px clamp(14px, 2.6vw, 34px);
    }

    .foot-left {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2vw, 28px);
      flex-wrap: wrap;
    }

    .foot-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(10.5px, 1.05vw, 13.5px);
      font-weight: 600;
      white-space: nowrap;
    }

    .foot-item svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .foot-social {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .foot-social a {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .16);
      border: 1.5px solid rgba(255, 255, 255, .7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background .15s ease;
    }

    .foot-social a:hover {
      background: rgba(255, 255, 255, .32);
    }

    .foot-social svg {
      width: 15px;
      height: 15px;
    }

    .foot-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(13px, 1.6vw, 20px);
      white-space: nowrap;
    }

    .foot-right .line {
      width: clamp(30px, 5vw, 80px);
      height: 1.5px;
      background: rgba(255, 255, 255, .85);
    }

    @media (min-width:760px) {
      .tagline {
        display: block;
      }
    }

    @media (max-width:640px) {
      .brand-text p {
        display: none;
      }

      nav.mainnav .navlink span {
        display: none;
      }

      .indice-panel {
        width: 34%;
      }

      .fac-panel {
        width: 60%;
        top: 8%;
      }

      .fac-row {
        flex-wrap: wrap;
        row-gap: 10px;
      }

      .foot-right .script-text {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="brand">
        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 6 L52 14 V30 C52 44 43 54 32 58 C21 54 12 44 12 30 V14 Z" fill="#7a3327" stroke="#e0b25a"
              stroke-width="1.5" />
            <path d="M32 14 L26 30 H38 L32 46" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"
              stroke-linejoin="round" />
            <text x="32" y="53" text-anchor="middle" font-size="7" fill="#e0b25a" font-family="Montserrat"
              font-weight="700">30</text>
          </svg>
        </div>
        <div class="brand-text">
          <h1>UNIVERSIDAD NACIONAL DE ITAPÚA</h1>
          <p>Líder en innovación y excelencia</p>
        </div>
      </div>

      <nav class="mainnav" aria-label="Navegación principal">
        <div class="navlink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5" />
            <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
          </svg>
          <span>INICIO</span>
        </div>
        <div class="navlink">

  <script>
    (function () {
      var list = document.getElementById('indiceList');
      var slider = document.getElementById('indiceSlider');
      var thumb = document.getElementById('indiceThumb');
      if (!list || !slider || !thumb) return;

      function thumbTravel() {
        return Math.max(0, slider.clientHeight - thumb.offsetHeight);
      }
      function maxScroll() {
        return Math.max(0, list.scrollHeight - list.clientHeight);
      }
      function setThumbFromScroll() {
        var ms = maxScroll();
        var ratio = ms ? (list.scrollTop / ms) : 0;
        thumb.style.top = (ratio * thumbTravel()) + 'px';
        thumb.setAttribute('aria-valuenow', Math.round(ratio * 100));
      }
      function setScrollFromY(clientY) {
        var rect = slider.getBoundingClientRect();
        var travel = thumbTravel();
        var y = clientY - rect.top - (thumb.offsetHeight / 2);
        y = Math.max(0, Math.min(travel, y));
        var ratio = travel ? (y / travel) : 0;
        thumb.style.top = y + 'px';
        list.scrollTop = ratio * maxScroll();
        thumb.setAttribute('aria-valuenow', Math.round(ratio * 100));
      }

      var dragging = false;
      function start(e) {
        dragging = true;
        thumb.style.cursor = 'grabbing';
        move(e);
        e.preventDefault();
      }
      function move(e) {
        if (!dragging) return;
        var y = (e.touches ? e.touches[0].clientY : e.clientY);
        setScrollFromY(y);
      }
      function end() {
        dragging = false;
        thumb.style.cursor = 'grab';
      }

      thumb.addEventListener('mousedown', start);
      thumb.addEventListener('touchstart', start, { passive: false });
      window.addEventListener('mousemove', move);
      window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('mouseup', end);
      window.addEventListener('touchend', end);

      slider.addEventListener('click', function (e) {
        if (e.target === thumb) return;
        setScrollFromY(e.clientY);
      });

      thumb.addEventListener('keydown', function (e) {
        var step = 24;
        if (e.key === 'ArrowDown') { list.scrollTop += step; setThumbFromScroll(); e.preventDefault(); }
        if (e.key === 'ArrowUp') { list.scrollTop -= step; setThumbFromScroll(); e.preventDefault(); }
      });

      list.addEventListener('scroll', setThumbFromScroll);
      window.addEventListener('resize', setThumbFromScroll);
      setThumbFromScroll();
    })();
  </script>
